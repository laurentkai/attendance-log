services:
  app:
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      APP_BASE_URL: ${APP_BASE_URL:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-attendance}:${POSTGRES_PASSWORD:-attendance_dev_password}@postgres:5432/${POSTGRES_DB:-attendance}
      DATABASE_SSL: "false"
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      APP_ENCRYPTION_KEY_FILE: /app-secrets/encryption.key
      APP_INSTANCE_ID_FILE: /app-secrets/instance-id
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-Europe/Brussels}
      BACKUP_RESTORE_MAX_MB: ${BACKUP_RESTORE_MAX_MB:-512}
    volumes:
      - app_secrets:/app-secrets
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendance}
      POSTGRES_USER: ${POSTGRES_USER:-attendance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attendance_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  app_secrets:
